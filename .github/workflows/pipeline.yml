name: ULTRA CORE 2.0 - Blindagem Total

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ultra-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security:
    name: Auditoria e Blindagem Ultra 1000x
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: 1. Checkout seguro do repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 2. Bloquear extensoes perigosas ou maliciosas
        shell: bash
        run: |
          echo "A verificar ficheiros suspeitos..."
          bad_files=$(find . -type f \( -name "*.exe" -o -name "*.bat" -o -name "*.cmd" -o -name "*.sh" -o -name "*.php" -o -name "*.dll" \) -not -path '*/.*' || true)
          if [ -n "$bad_files" ]; then
            echo "::error::BLOQUEIO DE SEGURANCA: Ficheiros executaveis ou suspeitos detetados: $bad_files"
            exit 1
          fi
          echo "Nenhum ficheiro malicioso encontrado."

      - name: 3. Verificar integridade dos ficheiros essenciais e Sintaxe JS
        shell: bash
        run: |
          for file in index.html style.css script.js; do
            found=$(find . -maxdepth 3 -name "$file" -not -path '*/.*' | head -n 1)
            if [ -z "$found" ] || [ ! -s "$found" ] || [ -L "$found" ]; then
              echo "::error::ALERTA: Ficheiro essencial ausente, vazio ou invalido: $file"
              exit 1
            fi
            echo "Ficheiro integro: $found"

            if [ "$file" = "script.js" ]; then
              node --check "$found"
              echo "Sintaxe JavaScript validada com sucesso."
            fi

            if [ "$file" = "index.html" ]; then
              if ! grep -qi "<html" "$found"; then
                echo "::error::O ficheiro index.html parece corrompido (sem tag html)."
                exit 1
              fi
            fi
          done

      - name: 4. Scanner de Segredos e Codigo Perigoso
        shell: bash
        run: |
          if grep -rnI -E "(AIza[0-9A-Za-z_-]{35}|ghp_[0-9A-Za-z]{36}|sk-[0-9A-Za-z]{48})" --include="*.html" --include="*.css" --include="*.js" . 2>/dev/null; then
            echo "::error::PERIGO: Possivel chave de API ou senha exposta no codigo!"
            exit 1
          fi

          if grep -rnI -E "\beval\s*\(" --include="*.js" . 2>/dev/null; then
            echo "::warning::Aviso de Seguranca: Uso de eval() detetado no JavaScript."
          fi
          echo "Scanner de vulnerabilidades concluido."

      - name: 5. Detetar marcadores de conflito de Git
        shell: bash
        run: |
          if grep -rnI -E "^(<<<<<<< |=======|>>>>>>> )" --include="*.html" --include="*.css" --include="*.js" --include="*.md" . 2>/dev/null; then
            echo "::error::Marcadores de conflito de merge encontrados!"
            exit 1
          fi
          echo "Zero conflitos encontrados."

      - name: 6. Gerar Relatorio de Seguranca
        shell: bash
        run: |
          echo "### 🛡️ Relatório ULTRA CORE 2.0" >> $GITHUB_STEP_SUMMARY
          echo "| Verificação | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Bloqueio de Executáveis/Malware** | ✅ Limpo |" >> $GITHUB_STEP_SUMMARY
          echo "| **Integridade (HTML, CSS, JS)** | ✅ Protegido |" >> $GITHUB_STEP_SUMMARY
          echo "| **Validação de Sintaxe Node.js** | ✅ Aprovado |" >> $GITHUB_STEP_SUMMARY
          echo "| **Scanner de Chaves e Conflitos** | ✅ Seguro |" >> $GITHUB_STEP_SUMMARY