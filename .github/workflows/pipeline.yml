
name: pipeline

on:
  push:

jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Exibir mensagem
        run: echo "Olá, GitHub Actions!"


name: ULTRA CORE - Protecao do Projeto

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ultra-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Verificacao de Integridade
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout seguro
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validar arquivos essenciais
        shell: bash
        run: |
          set -euo pipefail

          for f in index.html style.css script.js; do
            if [[ ! -f "$f" || -L "$f" || ! -s "$f" ]]; then
              echo "::error::Arquivo ausente, vazio ou link simbolico: $f"
              exit 1
            fi
          done

          echo "Arquivos essenciais validados."

      - name: Verificar sintaxe JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check script.js

      - name: Detectar conflitos de mesclagem
        shell: bash
        run: |
          set -euo pipefail

          if git grep -n -I -E \
            '^(<<<<<<< |=======|>>>>>>> )' \
            -- '*.html' '*.css' '*.js'; then
            echo "::error::Marcadores de conflito encontrados."
            exit 1
          fi

          echo "Nenhum marcador de conflito encontrado."

      - name: Verificar arquivos sensiveis conhecidos
        shell: bash
        run: |
          set -euo pipefail

          if git ls-files | grep -Ei \
            '(^|/)\.env($|\.)|(^|/)(id_rsa|id_ed25519|credentials\.json|secrets\.json)$'; then
            echo "::error::Possivel arquivo sensivel versionado."
            exit 1
          fi

          echo "Verificacao de nomes sensiveis concluida."

      - name: Verificar alteracoes do pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          git diff --check "$BASE_SHA" "$HEAD_SHA"

          echo "Resumo dos arquivos alterados:"
          git diff --name-status "$BASE_SHA" "$HEAD_SHA"

      - name: Confirmar verificacoes
        run: echo "ULTRA CORE: todas as verificacoes passaram."
