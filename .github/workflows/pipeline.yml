
name: ULTRA CORE - Protecao do Projeto

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ultra-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Verificacao de Seguranca
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout seguro
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Verificar arquivos essenciais
        shell: bash
        run: |
          set -euo pipefail

          for file in index.html style.css script.js; do
            if [[ ! -s "$file" || -L "$file" ]]; then
              echo "::error::Arquivo ausente, vazio ou link simbolico: $file"
              exit 1
            fi
          done

          echo "Arquivos essenciais encontrados."

      - name: Validar JavaScript
        shell: bash
        run: node --check script.js

      - name: Detectar conflitos
        shell: bash
        run: |
          set -euo pipefail

          if git grep -n -I -E \
            '^(<<<<<<< |=======|>>>>>>> )' \
            -- '*.html' '*.css' '*.js'; then
            echo "::error::Marcadores de conflito encontrados."
            exit 1
          fi

          echo "Nenhum conflito encontrado."

      - name: Verificar patch
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA" "$HEAD_SHA"

      - name: Finalizar
        run: echo "ULTRA CORE: verificacoes concluidas."
