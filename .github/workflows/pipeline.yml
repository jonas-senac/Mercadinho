name: ULTRA CORE - Protecao do Projeto Mercado

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ultra-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Verificacao de Seguranca Ultra 1000x
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout seguro do projeto
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Verificar integridade dos arquivos essenciais
        shell: bash
        run: |
          set -euo pipefail

          # Lista de arquivos vitais do mercadinho que nao podem estar vazios ou corrompidos
          for file in index.html style.css script.js; do
            if [[ ! -s "$file" || -L "$file" ]]; then
              echo "::error::ALERTA DE SEGURANCA: Arquivo ausente, vazio ou link simbolico detectado: $file"
              exit 1
            fi
          done

          echo "Todos os arquivos essenciais estao integros."

      - name: Validar sintaxe do JavaScript
        shell: bash
        run: node --check script.js

      - name: Bloquear marcadores de conflito indesejados
        shell: bash
        run: |
          set -euo pipefail

          if git grep -n -I -E \
            '^(<<<<<<< |=======|>>>>>>> )' \
            -- '*.html' '*.css' '*.js'; then
            echo "::error::ALERTA: Marcadores de conflito de codigo encontrados!"
            exit 1
          fi

          echo "Nenhum conflito de codigo detectado."

      - name: Verificar patch de alteracoes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA" "$HEAD_SHA"

      - name: Finalizar com Sucesso
        run: echo "ULTRA CORE: Todas as verificacoes de seguranca passaram com sucesso!"
